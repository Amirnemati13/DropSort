[package]
name = "dropsort"
version = "0.1.0"
edition = "2021"
authors = ["Amir Nemati"]
description = "A small Windows app that previews, sorts, and safely moves your files."
license = "MIT"
readme = "README.md"

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "accesskit"] }
rfd = "0.15"
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Storage_FileSystem", "Win32_Foundation"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "s"
lto = "thin"
strip = true
